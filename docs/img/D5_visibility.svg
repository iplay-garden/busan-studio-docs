<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6475"/></marker></defs><rect width="900" height="330" fill="#ffffff"/><text x="450" y="30" font-size="16" fill="#1b1f2a" font-weight="700" text-anchor="middle" font-family="'Noto Sans CJK KR','Malgun Gothic',sans-serif">결과물 공개 범위 — 기본은 비공개, 바꾸지 않는다</text><rect x="20" y="50" width="860" height="46" rx="8" fill="#ffffff" stroke="#1f9d55" stroke-width="2"/><text x="40" y="79" font-size="15" fill="#1f9d55" font-weight="700" text-anchor="start" font-family="'Noto Sans CJK KR','Malgun Gothic',sans-serif">비공개 · 미분류</text><text x="300" y="79" font-size="14" fill="#334155" font-weight="400" text-anchor="start" font-family="'Noto Sans CJK KR','Malgun Gothic',sans-serif">기본값. 나와 관리자만 본다</text><text x="860" y="79" font-size="14" fill="#1f9d55" font-weight="700" text-anchor="end" font-family="'Noto Sans CJK KR','Malgun Gothic',sans-serif">그대로 둔다</text><rect x="20" y="104" width="860" height="46" rx="8" fill="#ffffff" stroke="#d48806" stroke-width="2"/><text x="40" y="133" font-size="15" fill="#d48806" font-weight="700" text-anchor="start" font-family="'Noto Sans CJK KR','Malgun Gothic',sans-serif">공유 링크</text><text x="300" y="133" font-size="14" fill="#334155" font-weight="400" text-anchor="start" font-family="'Noto Sans CJK KR','Malgun Gothic',sans-serif">링크를 받은 회원은 비공개여도 본다</text><text x="860" y="133" font-size="14" fill="#d48806" font-weight="700" text-anchor="end" font-family="'Noto Sans CJK KR','Malgun Gothic',sans-serif">부산 담당자에게만</text><rect x="20" y="158" width="860" height="46" rx="8" fill="#ffffff" stroke="#d48806" stroke-width="2"/><text x="40" y="187" font-size="15" fill="#d48806" font-weight="700" text-anchor="start" font-family="'Noto Sans CJK KR','Malgun Gothic',sans-serif">공개 (폴더 공개)</text><text x="300" y="187" font-size="14" fill="#334155" font-weight="400" text-anchor="start" font-family="'Noto Sans CJK KR','Malgun Gothic',sans-serif">ComfyUI 권한이 있는 회원 모두가 본다</text><text x="860" y="187" font-size="14" fill="#d48806" font-weight="700" text-anchor="end" font-family="'Noto Sans CJK KR','Malgun Gothic',sans-serif">부산 지시가 있을 때만</text><rect x="20" y="212" width="860" height="46" rx="8" fill="#ffffff" stroke="#c0392b" stroke-width="2"/><text x="40" y="241" font-size="15" fill="#c0392b" font-weight="700" text-anchor="start" font-family="'Noto Sans CJK KR','Malgun Gothic',sans-serif">피드에 공개 (Byteplus)</text><text x="300" y="241" font-size="14" fill="#334155" font-weight="400" text-anchor="start" font-family="'Noto Sans CJK KR','Malgun Gothic',sans-serif">팀 피드에 올라간다</text><text x="860" y="241" font-size="14" fill="#c0392b" font-weight="700" text-anchor="end" font-family="'Noto Sans CJK KR','Malgun Gothic',sans-serif">끈다</text><rect x="20" y="266" width="860" height="46" rx="8" fill="#ffffff" stroke="#c0392b" stroke-width="2"/><text x="40" y="295" font-size="15" fill="#c0392b" font-weight="700" text-anchor="start" font-family="'Noto Sans CJK KR','Malgun Gothic',sans-serif">숨기기</text><text x="300" y="295" font-size="14" fill="#334155" font-weight="400" text-anchor="start" font-family="'Noto Sans CJK KR','Malgun Gothic',sans-serif">모든 사용자에게서 숨겨진다</text><text x="860" y="295" font-size="14" fill="#c0392b" font-weight="700" text-anchor="end" font-family="'Noto Sans CJK KR','Malgun Gothic',sans-serif">내 것이 아니면 누르지 않는다</text></svg>