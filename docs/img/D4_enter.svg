<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 190" width="900" height="190"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6475"/></marker></defs><rect width="900" height="190" fill="#ffffff"/><rect x="20" y="20" width="860" height="150" rx="12" fill="#fff1f0" stroke="#c0392b" stroke-width="2"/><text x="450" y="55" font-size="17" fill="#c0392b" font-weight="700" text-anchor="middle" font-family="'Noto Sans CJK KR','Malgun Gothic',sans-serif">Byteplus 만들기 화면 — 프롬프트 칸에서 Enter = 바로 생성 (비용 발생)</text><rect x="70" y="85" width="110" height="44" rx="8" fill="#ffffff" stroke="#334155" stroke-width="2"/><text x="125.0" y="113" font-size="16" fill="#1b1f2a" font-weight="700" text-anchor="middle" font-family="'Noto Sans CJK KR','Malgun Gothic',sans-serif">Enter</text><text x="200" y="113" font-size="15" fill="#c0392b" font-weight="700" text-anchor="start" font-family="'Noto Sans CJK KR','Malgun Gothic',sans-serif">→ 즉시 생성 · 되돌릴 수 없음</text><rect x="470" y="85" width="90" height="44" rx="8" fill="#ffffff" stroke="#334155" stroke-width="2"/><text x="515.0" y="113" font-size="16" fill="#1b1f2a" font-weight="700" text-anchor="middle" font-family="'Noto Sans CJK KR','Malgun Gothic',sans-serif">Shift</text><text x="575" y="113" font-size="18" fill="#334155" font-weight="700" text-anchor="middle" font-family="'Noto Sans CJK KR','Malgun Gothic',sans-serif">+</text><rect x="590" y="85" width="90" height="44" rx="8" fill="#ffffff" stroke="#334155" stroke-width="2"/><text x="635.0" y="113" font-size="16" fill="#1b1f2a" font-weight="700" text-anchor="middle" font-family="'Noto Sans CJK KR','Malgun Gothic',sans-serif">Enter</text><text x="695" y="113" font-size="15" fill="#1f9d55" font-weight="700" text-anchor="start" font-family="'Noto Sans CJK KR','Malgun Gothic',sans-serif">→ 줄바꿈</text><text x="450" y="160" font-size="13" fill="#475569" font-weight="400" text-anchor="middle" font-family="'Noto Sans CJK KR','Malgun Gothic',sans-serif">긴 프롬프트는 메모장에서 다 쓴 뒤 붙여넣고, 설정을 모두 확인한 다음 생성한다</text></svg>